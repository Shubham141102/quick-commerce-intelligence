[project]
name = "quick-commerce-intelligence"
version = "0.1.0"
description = "End-to-end PySpark Medallion pipeline (CSV storage) with ML, RAG and multi-persona Streamlit analytics"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
generation = ["faker>=24.0"]
pipeline = [
    "pyspark>=3.5,<3.6",
    "scikit-learn>=1.4",
    "mlxtend>=0.23",
    "joblib>=1.3",
]
app = [
    "streamlit>=1.40",
    "duckdb>=1.0",
    "plotly>=5.20",
    "rank-bm25>=0.2.2",
    "bcrypt>=4.1",
]
dev = [
    "pytest>=8.0",
    "chispa>=0.10",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:distutils Version classes are deprecated:DeprecationWarning:pyspark"]

[tool.ruff]
line-length = 100
target-version = "py311"
