- question: Can a refund be larger than the payment?
  expect: {doc_id: POL-REF, section: "3. Refund amount limit"}
- question: What discount levels are allowed for promotions?
  expect: {doc_id: POL-PRO, section: "2. Discount limits"}
- question: Which cancellation reasons are allowed after dispatch?
