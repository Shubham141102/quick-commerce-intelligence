- question: How is average order value calculated?
  expect: {doc_id: MET-DEF, section: "Average order value"}
- question: How do we estimate the sales lost to stockouts?
  expect: {doc_id: MC-LOST, section: "Lost-sales estimate"}
- question: What is the capital of France?
  expect: {}
- question: Will it rain in Mumbai tomorrow?
  expect: {}
- question: Who won the cricket match yesterday?
  expect: {}
